version: "2"
linters:
  default: all
  disable:
    - depguard
    - ireturn
    - mnd
    - paralleltest
    - testifylint
    - wsl

    # Enabled by the v1 -> v2 migration, and by golangci-lint gaining linters
    # that did not exist when this codebase was written. Each flags style on
    # code that predates it rather than a defect, and turning them on would
    # mean rewriting inherited code to satisfy a rule nobody chose. Recorded in
    # docs/backlog.md rather than silently accepted forever.
    - exhaustruct # every struct literal must name every field
    - funcorder   # declaration order convention
    - goconst     # repeated string literals, all of them in tests
    - lll         # line length
    - noinlineerr # forbids `if err := f(); err != nil`
    - prealloc    # slice capacity hints
    - varnamelen  # identifier length against scope size
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - err113
          - funlen
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: true
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
