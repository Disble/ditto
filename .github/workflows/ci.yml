name: "🧩 Continuous Integration"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lets a run be started by hand. Without it there is no way to exercise CI
  # except by pushing, which makes diagnosing a workflow that never fires cost
  # a commit each time.
  workflow_dispatch:

jobs:

  CI:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.continue-on-error }}
    strategy:
      matrix:
        go-version: [ "1.27" ]
        continue-on-error: [ false ]
        include:
          - go-version: "latest"
            continue-on-error: false
    steps:
    - uses: actions/checkout@v6

    - name: Install Devbox
      uses: jetify-com/devbox-install-action@v0.15.0

    - name: Set up Go ${{ matrix.go-version }}
      run: devbox add go@${{ matrix.go-version }}

    - name: "🧹 Lint"
      run: devbox run -- make lint

    - name: "🧪 Test"
      run: devbox run -- make test
